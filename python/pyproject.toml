[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hostfog-sigil"
version = "1.0.0"
description = "JWT, JWS, JWE and JWK for Python"
readme = "README.md"
license = "MIT"
authors = [{ name = "HostFog Ltd" }]
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/sigil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
files = ["src", "tests", "interop.py"]
